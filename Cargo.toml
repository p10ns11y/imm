[package]
name = "imm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Admit a direct dependency as whole source. Every other use is one record: hash, audit, and diff."
publish = false

[[bin]]
name = "imm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
